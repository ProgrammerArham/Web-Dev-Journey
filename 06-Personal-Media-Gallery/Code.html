<!-- Create a Personal Media Gallery webpage using HTML video, audio, and image elements? -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persnal Media Gallery</title>
</head>

<body>
    <h1>Personal Media Gallery</h1>


    <h2>Image</h2>
    <figure>
        <img src="Image.png" alt="Image of Programming Social Media Banner" width="700">
        <figcaption>Image of Programming Social Media Banner/Cover</figcaption>
    </figure>

    <h2>Audio</h2>
    <figure>
        <audio controls loop muted>
            <source src="Audio.mp3" type="audio/mpeg">
        </audio>

        <figcaption>Serene View Audio</figcaption>
    </figure>

    <h2>Video</h2>
    <figure>
        <video controls width="400">
            <source src="Video.mp4" type="video/mp4">
        </video>

        <figcaption>Curved Highway through the Mountain Ranges</figcaption>
    </figure>
</body>

</html>
